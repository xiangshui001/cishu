name: Build course presentation
on:
  push:
    branches: [main]
    paths:
      - 'slides/presentation.json'
      - 'scripts/build_presentation.py'
      - '.github/workflows/build-presentation.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: course-presentation-main
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install presentation dependencies
        run: |
          python -m pip install python-pptx==1.0.2
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-impress fonts-noto-cjk
      - name: Generate editable presentation, PDF and speaker notes
        run: python scripts/build_presentation.py --pdf
      - name: Commit generated deliverables
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- slides/cishu_literature_review.pptx slides/cishu_literature_review.pdf slides/speaker_notes.md slides/build_manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: publish course presentation and speaker notes'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: cishu-course-presentation
          path: |
            slides/cishu_literature_review.pptx
            slides/cishu_literature_review.pdf
            slides/speaker_notes.md
            slides/build_manifest.json
          retention-days: 7
